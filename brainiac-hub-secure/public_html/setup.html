<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemasangan Brainiac Hub</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/auth.css"><script src="/setup.js" defer></script></head><body data-auth="login"><main class="auth-screen"><div class="auth-card"><img src="/assets/brand/beruntung-brainiac-logo.png" alt="Beruntung Brainiac"><h1>Cipta Admin pertama</h1><p>Gunakan kod pemasangan daripada konfigurasi peribadi server. Pemasangan ditutup selepas akaun pertama dicipta.</p><form id="setup-form"><label class="field">Kod pemasangan<input name="token" type="password" autocomplete="off" required></label><label class="field">Nama Admin<input name="name" maxlength="120" required></label><label class="field">Emel<input name="email" type="email" autocomplete="username" required></label><label class="field">Kata laluan<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label class="field">Ulang kata laluan<input name="confirm" type="password" autocomplete="new-password" required></label><p id="setup-message" role="alert"></p><button class="primary">Cipta Admin</button></form><p><a href="/">Kembali ke login</a></p></div></main></body></html>
