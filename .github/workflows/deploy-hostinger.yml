name: Deploy Brainiac Hub to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'brainiac-hub-secure/**'
      - '.github/workflows/deploy-hostinger.yml'
      - '.github/scripts/deploy_hostinger.py'
  workflow_dispatch:

jobs:
  verify:
    name: Syntax & Package Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP, JS & Python files
        working-directory: brainiac-hub-secure
        run: |
          php -l public/api.php
          php -l brainiac-private/bootstrap.php
          for f in public/*.js; do node -c "$f"; done
          python3 -m py_compile ../.github/scripts/deploy_hostinger.py

      - name: Verify package rules
        working-directory: brainiac-hub-secure
        run: |
          python3 package.py
          rm -f ../brainiac-hub-hostinger-LOGIN-DATABASE.zip

  deploy:
    name: Deploy public_html & brainiac-private to Hostinger
    needs: verify
    runs-on: ubuntu-latest
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy_hostinger.py
