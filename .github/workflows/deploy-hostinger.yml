name: Deploy Brainiac Hub to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'brainiac-hub-secure/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Syntax & Package Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP & JS files
        working-directory: brainiac-hub-secure
        run: |
          php -l public/api.php
          php -l brainiac-private/bootstrap.php
          for f in public/*.js; do node -c "$f"; done

      - name: Verify package rules
        working-directory: brainiac-hub-secure
        run: python3 package.py

  deploy:
    name: Deploy to Hostinger
    needs: verify
    runs-on: ubuntu-latest
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy public/ & brainiac-private/ via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" $FTP_SERVER;
            mirror -R --verbose --no-perms ./brainiac-hub-secure/public/ ./public_html/;
            mirror -R --verbose --no-perms --exclude '^config\.php$' ./brainiac-hub-secure/brainiac-private/ ./brainiac-private/;
            bye
          "
