name: Deploy Brainiac Hub to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'brainiac-hub-secure/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Syntax & Package Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP & JS files
        working-directory: brainiac-hub-secure
        run: |
          php -l public/api.php
          php -l brainiac-private/bootstrap.php
          for f in public/*.js; do node -c "$f"; done

      - name: Verify package rules
        working-directory: brainiac-hub-secure
        run: python3 package.py

  deploy:
    name: Deploy to Hostinger via SSH
    needs: verify
    runs-on: ubuntu-latest
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Sync public_html & brainiac-private via SSH
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          BASE_DIR=$(sshpass -p "$SSH_PASS" ssh -p 65002 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" 'if [ -d "$HOME/domains/brainiachub.io/public_html" ]; then echo "$HOME/domains/brainiachub.io"; else echo "$HOME"; fi')
          echo "Target base directory: $BASE_DIR"

          sshpass -p "$SSH_PASS" ssh -p 65002 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p '$BASE_DIR/public_html' '$BASE_DIR/brainiac-private' && rm -rf '$BASE_DIR/public_html/public_html' '$BASE_DIR/public_html/.ftp-deploy-sync-state.json'"

          sshpass -p "$SSH_PASS" rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            ./brainiac-hub-secure/public/ \
            "$SSH_USER@$SSH_HOST:$BASE_DIR/public_html/"

          sshpass -p "$SSH_PASS" rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            --exclude='config.php' \
            ./brainiac-hub-secure/brainiac-private/ \
            "$SSH_USER@$SSH_HOST:$BASE_DIR/brainiac-private/"
